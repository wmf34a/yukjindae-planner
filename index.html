<!DOCTYPE html>
<html lang="ko">
<head>
<!--
  배포 체크리스트 (Cloudflare Pages)
  1. cloudflare.com → Workers & Pages → Create → Upload assets
  2. index.html 파일 드래그 앤 드롭 → 프로젝트명 입력 → Deploy
  3. 배포 완료 후 생성된 URL (예: wonju-trip.pages.dev) 확인
  4. 네이버 지도 콘솔 (https://console.ncloud.com) → Application 설정
     → Web Dynamic Map → 서비스 URL에 배포 URL 추가
  5. CONFIG.naverMapClientId 에 실제 Client ID 입력 후 재배포
  6. 팔로워에게 Cloudflare URL 공유

  ※ 데이터 관련 참고사항 (2026-08-21 갱신)
  - 소금산 그랜드밸리·소금산미디어아트센터·스톤크릭·국립강원전문과학관 4곳의 주소/좌표/
    운영시간/요금은 "육진대 맵 장소 DB"(Notion, 가족이 직접 관리하는 큐레이션 DB)와
    대조해 그 값으로 보정했습니다. 전화번호는 DB에 없는 필드라 원주문화재단·원주시청
    관광포털 등 공식 페이지 조사 결과를 그대로 사용했습니다.
  - "온정리닭갈비금강막국수 원주점"과 "오크밸리리조트 힐스빌리지"는 위 DB에도 등록되어
    있지 않아, 오크밸리는 웹 조사 결과로, 온정리닭갈비는 운영시간/요금/전화번호를
    "확인 필요"로 비워둔 채 사용자가 직접 알려준 주소만 반영했습니다.
  - 온정리닭갈비·오크밸리의 좌표는 무료 지오코딩(OpenStreetMap Nominatim)으로 확보한
    도로 단위 근사치입니다. 실제 서비스 배포 시 네이버 지도에서 직접 좌표를 재확인하는
    것을 권장하며, 가능하면 이 두 곳도 "육진대 맵 장소 DB"에 등록해두면 다음부터는
    이 페이지와 육진대맵 앱이 같은 데이터를 공유할 수 있습니다.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>육진대 × 원주여행</title>
<style>
  :root {
    --color-primary: #2D6A4F;
    --color-primary-dark: #1F4E3A;
    --color-accent: #F4A261;
    --color-bg: #F8F9FA;
    --color-card: #FFFFFF;
    --color-text: #1C2733;
    --color-text-secondary: #6B7A89;
    --color-border: #E5E9EE;
    --radius: 16px;
    --shadow: 0 4px 16px rgba(28, 39, 51, 0.08);
    --max-width: 480px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  #app {
    max-width: var(--max-width);
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    background: var(--color-bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* ---------- Header & Tabs ---------- */
  .app-header {
    padding: calc(18px + var(--safe-top)) 20px 14px;
    background: linear-gradient(160deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
    color: #fff;
    border-radius: 0 0 20px 20px;
    box-shadow: var(--shadow);
  }
  .app-header__title { font-size: 21px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.3px; }
  .app-header__subtitle { font-size: 13px; opacity: 0.88; margin: 0; }

  .tab-bar {
    display: flex;
    gap: 6px;
    margin: 14px 20px 0;
    background: rgba(255,255,255,0.94);
    border-radius: 999px;
    padding: 4px;
    box-shadow: var(--shadow);
    position: sticky;
    top: var(--safe-top);
    z-index: 40;
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--color-text-secondary);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 0;
    border-radius: 999px;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .tab-btn.is-active { background: var(--color-primary); color: #fff; }

  .view { display: none; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .view.is-active { display: flex; }
  #view-map.is-active { overflow: hidden; } /* 지도 탭은 화면에 딱 맞춰 보여주고, 스크롤은 코스목록 탭에서만 */

  /* ---------- Summary banner ---------- */
  .summary-banner {
    margin: 16px 20px 4px;
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 13px 16px;
    box-shadow: var(--shadow);
    font-size: 12.5px;
    color: var(--color-text-secondary);
    white-space: nowrap;
    overflow-x: auto;
  }
  .summary-banner strong { color: var(--color-primary); font-weight: 800; }
  .summary-banner .dot { color: var(--color-border); margin: 0 1px; }

  /* ---------- Course list ---------- */
  .course-list { padding: 12px 20px 32px; display: flex; flex-direction: column; }

  .place-card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .place-card__top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .place-card__badge {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--color-primary); color: #fff;
    font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .place-card__name { font-size: 17px; font-weight: 800; margin: 0; line-height: 1.35; }

  .place-card__row {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px; color: var(--color-text-secondary);
    margin-bottom: 6px; line-height: 1.5;
  }
  .place-card__row .icon { flex-shrink: 0; width: 16px; text-align: center; }
  .place-card__row a.link { color: var(--color-primary); font-weight: 600; }
  .fee-free-badge {
    display: inline-block; font-size: 11px; font-weight: 800;
    background: var(--color-accent); color: #fff;
    padding: 2px 8px; border-radius: 999px; margin-left: 6px;
  }

  .place-card__actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    flex: 1; border: none; border-radius: 12px;
    padding: 11px 0; font-size: 13px; font-weight: 700;
    text-align: center;
  }
  .btn-primary { background: var(--color-primary); color: #fff; }
  .btn-secondary { background: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-border); }

  .travel-divider {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; flex-wrap: wrap;
    font-size: 12px; color: var(--color-text-secondary);
    padding: 12px 8px;
    text-align: center;
  }
  .travel-divider::before, .travel-divider::after {
    content: ""; flex: 1; height: 1px; background: var(--color-border); align-self: center;
    min-width: 12px;
  }
  .travel-divider .seg { white-space: nowrap; }
  .travel-divider .estimated { opacity: 0.7; }

  /* ---------- Detail Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(17, 24, 32, 0.55);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; visibility: hidden;
    transition: opacity 0.22s ease, visibility 0.22s;
  }
  .modal-overlay.is-open { opacity: 1; visibility: visible; }
  .modal-sheet {
    width: 100%; max-width: var(--max-width);
    max-height: 90vh;
    background: var(--color-card);
    border-radius: 20px 20px 0 0;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    overflow: hidden;
  }
  .modal-overlay.is-open .modal-sheet { transform: translateY(0); }
  .modal-sheet__grip { width: 36px; height: 4px; background: var(--color-border); border-radius: 999px; margin: 10px auto 2px; flex-shrink: 0; }
  .modal-sheet__scroll { overflow-y: auto; padding-bottom: calc(20px + var(--safe-bottom)); }

  .modal-hero {
    height: 150px;
    display: flex; align-items: center; justify-content: center;
    font-size: 52px;
    background: linear-gradient(135deg, rgba(45,106,79,0.14), rgba(244,162,97,0.18));
    position: relative;
  }
  .modal-hero .close-btn {
    position: absolute; top: 12px; right: 14px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.9); border: none;
    font-size: 16px; color: var(--color-text);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
  }

  .modal-body { padding: 16px 20px 4px; }
  .modal-category {
    display: inline-block; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
    background: rgba(45, 106, 79, 0.1); color: var(--color-primary);
    margin-bottom: 8px;
  }
  .modal-title { font-size: 20px; font-weight: 800; margin: 0 0 14px; line-height: 1.3; }
  .modal-desc { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; margin: 0 0 16px; }

  .modal-info-block { border-top: 1px solid var(--color-border); padding: 14px 0; }
  .modal-info-block__label { font-size: 12px; font-weight: 700; color: var(--color-text-secondary); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
  .modal-info-block__value { font-size: 14px; line-height: 1.6; white-space: pre-line; }
  .modal-info-block__value.is-link { color: var(--color-primary); font-weight: 700; }
  .modal-info-block__sub { font-size: 12px; color: var(--color-text-secondary); margin: 6px 0 0; line-height: 1.6; }
  .modal-info-block__sub li { margin-bottom: 2px; }

  .modal-minimap {
    height: 160px; border-radius: 12px; overflow: hidden;
    background: var(--color-bg); border: 1px solid var(--color-border);
    margin-top: 6px;
    position: relative;
  }
  .map-fallback {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 14px; text-align: center;
    color: var(--color-text-secondary); font-size: 12px; line-height: 1.5;
    background: repeating-linear-gradient(135deg, #F1F3F5, #F1F3F5 10px, #F8F9FA 10px, #F8F9FA 20px);
  }
  .map-fallback .pin { font-size: 26px; }

  .modal-actions { padding: 16px 20px 6px; display: flex; flex-direction: column; gap: 8px; }

  /* ---------- Map tab ---------- */
  .map-view-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  #naver-map {
    flex: 1; min-height: 0;
    background: var(--color-border);
  }
  .map-fallback-full {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 30px; text-align: center;
    background: var(--color-bg);
  }
  .map-fallback-full[hidden] { display: none; } /* [hidden] 기본 UA 규칙보다 .map-fallback-full의 display:flex가 우선 적용되는 걸 막는다 */
  .map-fallback-full .big-pin { font-size: 40px; }
  .map-fallback-full h3 { margin: 0; font-size: 15px; }
  .map-fallback-full p { margin: 0; font-size: 12.5px; color: var(--color-text-secondary); line-height: 1.6; }
  .map-fallback-full .fallback-order { display: flex; flex-direction: column; gap: 6px; width: 100%; margin-top: 6px; }
  .map-fallback-full .fallback-order__item {
    display: flex; align-items: center; gap: 8px;
    background: var(--color-card); border: 1px solid var(--color-border);
    border-radius: 10px; padding: 8px 10px; font-size: 12.5px; text-align: left;
  }
  .map-fallback-full .fallback-order__badge {
    width: 20px; height: 20px; border-radius: 50%; background: var(--color-primary); color: #fff;
    font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .map-toast {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 30;
    background: rgba(28, 39, 51, 0.92); color: #fff;
    font-size: 12.5px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px;
    box-shadow: var(--shadow);
    opacity: 0; transition: opacity 0.2s ease;
    white-space: nowrap;
    pointer-events: none;
  }
  .map-toast.is-visible { opacity: 1; }

  .map-bottom-panel {
    background: var(--color-card);
    border-top: 1px solid var(--color-border);
    padding: 14px 18px calc(14px + var(--safe-bottom));
    box-shadow: 0 -4px 16px rgba(28,39,51,0.06);
    z-index: 10;
  }
  .map-bottom-panel__current { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .map-bottom-panel__badge {
    width: 24px; height: 24px; border-radius: 50%; background: var(--color-primary); color: #fff;
    font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .map-bottom-panel__name { font-size: 15px; font-weight: 800; }
  .map-bottom-panel__meta { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
  .map-bottom-panel__nav { display: flex; gap: 8px; }
  .map-bottom-panel__nav .btn:disabled { opacity: 0.4; }
  .btn-icon {
    flex: 0 0 auto; padding: 0 12px; font-size: 12.5px; font-weight: 700; white-space: nowrap;
    background: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-border);
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .btn-icon.is-active { background: rgba(45, 106, 79, 0.12); border-color: var(--color-primary); }

  /* naver marker label */
  .pin-wrap { position: relative; width: 32px; height: 42px; }
  .pin-label {
    position: absolute; left: 50%; top: -6px; transform: translate(-50%, -100%);
    background: #fff; border: 1px solid var(--color-border);
    border-radius: 8px; padding: 3px 8px;
    font-size: 11px; font-weight: 700; color: var(--color-text);
    white-space: nowrap; box-shadow: var(--shadow);
  }
  .pin-label.is-current { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }

  @media (min-width: 481px) {
    #app { border-left: 1px solid var(--color-border); border-right: 1px solid var(--color-border); }
  }
</style>
</head>
<body>
<div id="app">

  <header class="app-header">
    <p class="app-header__title">육진대 × 원주여행</p>
    <p class="app-header__subtitle">육진대 멤버들과 함께 떠나는 원주 하루 여행</p>
  </header>

  <nav class="tab-bar" role="tablist">
    <button class="tab-btn is-active" data-tab="course" role="tab" aria-selected="true">코스목록</button>
    <button class="tab-btn" data-tab="map" role="tab" aria-selected="false">지도</button>
  </nav>

  <!-- ===================== 코스목록 탭 ===================== -->
  <section class="view is-active" id="view-course">
    <div class="summary-banner" id="summary-banner">
      총 6곳 · 이동 정보를 계산하고 있어요...
    </div>
    <div class="course-list" id="course-list"></div>
  </section>

  <!-- ===================== 지도 탭 ===================== -->
  <section class="view" id="view-map">
    <div class="map-view-wrap">
      <div id="naver-map"></div>
      <div class="map-toast" id="map-toast"></div>
      <div class="map-fallback-full" id="map-fallback-full" hidden>
        <div class="big-pin">🗺️</div>
        <h3>지도를 표시할 수 없어요</h3>
        <p>네이버 지도 Client ID가 아직 설정되지 않았어요.<br>배포 후 CONFIG.naverMapClientId에 실제 Client ID를 입력하면<br>지도가 정상적으로 표시돼요.</p>
        <div class="fallback-order" id="fallback-order"></div>
      </div>
    </div>
    <div class="map-bottom-panel">
      <div class="map-bottom-panel__current">
        <div class="map-bottom-panel__badge" id="panel-badge">1</div>
        <div>
          <div class="map-bottom-panel__name" id="panel-name">-</div>
          <div class="map-bottom-panel__meta" id="panel-meta">-</div>
        </div>
      </div>
      <div class="map-bottom-panel__nav">
        <button class="btn btn-secondary" id="btn-prev">← 이전 장소</button>
        <button class="btn btn-icon" id="btn-mylocation" aria-label="내 위치">📍 내 위치</button>
        <button class="btn btn-primary" id="btn-next">다음 장소 →</button>
      </div>
    </div>
  </section>

</div>

<!-- ===================== 상세보기 모달 ===================== -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-sheet__grip"></div>
    <div class="modal-sheet__scroll">
      <div class="modal-hero" id="modal-hero">
        <button class="close-btn" id="modal-close-x" aria-label="닫기">✕</button>
        <span id="modal-hero-emoji">📍</span>
      </div>
      <div class="modal-body">
        <span class="modal-category" id="modal-category">명소</span>
        <h2 class="modal-title" id="modal-title">장소명</h2>
        <p class="modal-desc" id="modal-desc"></p>

        <div class="modal-info-block">
          <p class="modal-info-block__label">🕒 운영시간</p>
          <p class="modal-info-block__value" id="modal-hours"></p>
          <ul class="modal-info-block__sub" id="modal-hours-detail"></ul>
        </div>

        <div class="modal-info-block">
          <p class="modal-info-block__label">💳 입장료 / 이용요금</p>
          <p class="modal-info-block__value" id="modal-fee"></p>
        </div>

        <div class="modal-info-block">
          <p class="modal-info-block__label">📞 전화번호</p>
          <p class="modal-info-block__value" id="modal-phone"></p>
        </div>

        <div class="modal-info-block">
          <p class="modal-info-block__label">📍 주소</p>
          <p class="modal-info-block__value is-link" id="modal-address"></p>
          <div class="modal-minimap" id="modal-minimap"></div>
        </div>
      </div>
      <div class="modal-actions">
        <a class="btn btn-primary" id="modal-directions-btn" target="_blank" rel="noopener noreferrer">네이버 지도로 길찾기</a>
        <button class="btn btn-secondary" id="modal-close-btn">닫기</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===================== 설정 ===================== */
const CONFIG = {
  naverMapClientId: 'tvz6iany8w'
};

const OSRM_BASE = 'https://router.project-osrm.org/route/v1/driving';
const WALK_KMH = 4;
const CAR_ANIM_MS = 1100;

/* ===================== 데이터 (하드코딩) ===================== */
const PLACES = {
  sogeumsan: {
    id: 'sogeumsan',
    name: '원주 소금산 그랜드밸리',
    category: '명소',
    emoji: '🏞️',
    address: '강원특별자치도 원주시 지정면 지정로 317 (소금산그랜드밸리 통합센터)',
    lat: 37.362467,
    lng: 127.835065,
    hoursSummary: '하절기(4~10월) 09:00~18:00 · 동절기(11~3월) 09:00~17:00',
    hoursDetail: [
      '매표 마감: 하절기 16:30 / 동절기 15:30',

// 이 페이지는 육진대 멤버들이 실제로 다녀온 여행을 소개하는 글이라, 노출 순서는
// 지리적 최적해가 아니라 "실제로 다녀온 순서" 그대로 둔다.
// (참고: 지정면 클러스터 내부에서 스톤크릭을 온정리닭갈비보다 먼저 방문하면
//  총 이동거리를 약 1.6km 줄일 수 있다 — 추후 여행 플래너 앱으로 발전시킬 때
//  동선 최적화 로직에 참고할 것.)
const ROUTE_ORDER = ['sogeumsan', 'mediaart', 'lunch', 'science', 'stonecreek', 'okvalley'];
const ROUTE = ROUTE_ORDER.map((id) => PLACES[id]);

/* ===================== 유틸 ===================== */
function haversineKm(a, b) {
  const R = 6371;
  const dLat = ((b.lat - a.lat) * Math.PI) / 180;
  const dLng = ((b.lng - a.lng) * Math.PI) / 180;
  const lat1 = (a.lat * Math.PI) / 180;
  const lat2 = (b.lat * Math.PI) / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function formatKm(m) { return m < 1000 ? `${Math.round(m)}m` : `${(m / 1000).toFixed(1)}km`; }
function formatMin(min) {
  min = Math.max(1, Math.round(min));
  if (min < 60) return `${min}분`;
  const h = Math.floor(min / 60), r = min % 60;
  return r === 0 ? `${h}시간` : `${h}시간 ${r}분`;
}
function telHref(phone) { return `tel:${phone.replace(/[^0-9+]/g, '')}`; }
function mapSearchUrl(place) { return `https://map.naver.com/p/search/${encodeURIComponent(place.name + ' ' + place.address)}`; }
function toWebMercator(lat, lng) {
  const R = 20037508.34;
  const x = (lng * R) / 180;
  const y = (Math.log(Math.tan(((90 + lat) * Math.PI) / 360)) / (Math.PI / 180)) * (R / 180);
  return { x, y };
}
function buildWebDirectionsUrl(place) {
  const { x, y } = toWebMercator(place.lat, place.lng);
  return `https://map.naver.com/p/directions/-/${x},${y},${encodeURIComponent(place.name)}/-/car`;
}
function buildNmapUrl(place) {
  const params = new URLSearchParams();
  params.set('dlat', place.lat);
  params.set('dlng', place.lng);
  params.set('dname', place.name);
  params.set('appname', location.origin || 'yukjindae-planner');
  return `nmap://route/car?${params.toString()}`;
}
function isMobileUA() { return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent); }

/* ===================== 구간(OSRM) 계산 ===================== */
// segments[i] = ROUTE[i] → ROUTE[i+1]
let SEGMENTS = ROUTE.slice(1).map((to, i) => {
  const from = ROUTE[i];
  const straightM = haversineKm(from, to) * 1000;
  return { from, to, distanceM: straightM, durationS: (straightM / 1000 / 30) * 3600, walkMin: (straightM / 1000 / WALK_KMH) * 60, geometry: [[from.lat, from.lng], [to.lat, to.lng]], estimated: true };
});

async function fetchOsrmSegment(from, to) {
  try {
    const url = `${OSRM_BASE}/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.code !== 'Ok' || !data.routes || !data.routes[0]) throw new Error('no route');
    const route = data.routes[0];
    const straightM = haversineKm(from, to) * 1000;
    return {
      from, to,
      distanceM: route.distance,
      durationS: route.duration,
      walkMin: (straightM / 1000 / WALK_KMH) * 60,
      geometry: route.geometry.coordinates.map((c) => [c[1], c[0]]),
      estimated: false
    };
  } catch (err) {
    console.warn('OSRM 요청 실패, 직선거리로 대체합니다:', err);
    const straightM = haversineKm(from, to) * 1000;
    return { from, to, distanceM: straightM, durationS: (straightM / 1000 / 30) * 3600, walkMin: (straightM / 1000 / WALK_KMH) * 60, geometry: [[from.lat, from.lng], [to.lat, to.lng]], estimated: true };
  }
}

async function resolveAllSegments() {
  const pairs = ROUTE.slice(1).map((to, i) => [ROUTE[i], to]);
  const results = await Promise.all(pairs.map(([f, t]) => fetchOsrmSegment(f, t)));
  SEGMENTS = results;
  return results;
}

function renderTravelDivider(segment, resolved) {
  if (!resolved) {
    return `<div class="travel-divider estimated"><span class="seg">🚗 이동 정보 계산 중...</span></div>`;
  }
  const carMin = formatMin(segment.durationS / 60);
  const walkText = segment.distanceM > 15000 ? '도보 이동 어려움' : `도보 약 ${formatMin(segment.walkMin)}`;
  const est = segment.estimated ? ' (예상)' : '';
  return `<div class="travel-divider"><span class="seg">🚗 자차 ${carMin} · ${formatKm(segment.distanceM)}${est}</span><span class="dot">/</span><span class="seg">🚶 ${walkText}</span></div>`;
}

function renderCourseList(resolved) {
  const list = document.getElementById('course-list');
  let html = '';
  ROUTE.forEach((place, i) => {
    html += renderPlaceCard(place, i);
    if (i < ROUTE.length - 1) html += renderTravelDivider(SEGMENTS[i], resolved);
  });
  list.innerHTML = html;
  list.querySelectorAll('[data-action="detail"]').forEach((btn) => {
    btn.addEventListener('click', () => openDetailModal(btn.dataset.place));
  });
}

function renderSummaryBanner(resolved) {
  const el = document.getElementById('summary-banner');
  if (!resolved) {
    el.innerHTML = `총 <strong>${ROUTE.length}곳</strong> <span class="dot">·</span> 이동 정보를 계산하고 있어요...`;
    return;
  }
  const totalM = SEGMENTS.reduce((s, seg) => s + seg.distanceM, 0);
  const totalMin = SEGMENTS.reduce((s, seg) => s + seg.durationS / 60, 0);
  el.innerHTML = `총 <strong>${ROUTE.length}곳</strong> <span class="dot">·</span> 이동 약 <strong>${formatMin(totalMin)}</strong> <span class="dot">·</span> <strong>${formatKm(totalM)}</strong>`;
}

    ? `<a class="modal-info-block__value is-link" href="${telHref(place.phone)}">${place.phone} (탭하여 전화 연결)</a>`
    : `전화번호 확인 필요`;

  const directionsBtn = document.getElementById('modal-directions-btn');
  const webUrl = buildWebDirectionsUrl(place);
  directionsBtn.href = webUrl;
  if (isMobileUA()) {
    directionsBtn.onclick = (e) => {
      e.preventDefault();
      const fallback = setTimeout(() => window.open(webUrl, '_blank', 'noopener'), 1200);
      window.addEventListener('pagehide', () => clearTimeout(fallback), { once: true });
      location.href = buildNmapUrl(place);
    };
  } else {
    directionsBtn.onclick = null;
  }

  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('is-open');
  history.pushState({ modal: true }, '');
  currentModalPlace = place;
  renderMiniMap(place);
  ensureNaverScriptLoading(); // 지도 탭을 열지 않았어도 상세보기에서 바로 미니맵이 뜨도록 로드를 트리거한다.
}

  const overlay = document.getElementById('modal-overlay');
  if (!overlay.classList.contains('is-open')) return;
  overlay.classList.remove('is-open');
  currentModalPlace = null;
  if (history.state && history.state.modal) history.back();

function renderMiniMap(place) {
  const el = document.getElementById('modal-minimap');
  el.innerHTML = '';
  if (!naverReady || !window.naver || !window.naver.maps) {
    el.innerHTML = `<div class="map-fallback"><span class="pin">📍</span><span>지도 미리보기는 네이버 지도 Client ID 설정 후 표시돼요.<br>위 주소를 탭하면 네이버 지도로 바로 이동할 수 있어요.</span></div>`;
    return;
  }
  try {
    const map = new naver.maps.Map(el, {
      center: new naver.maps.LatLng(place.lat, place.lng),
      zoom: 16,
      logoControlOptions: { position: naver.maps.Position.TOP_LEFT }
    });
    new naver.maps.Marker({ position: new naver.maps.LatLng(place.lat, place.lng), map, icon: pinIcon(place, ROUTE_ORDER.indexOf(place.id) + 1, false) });
  } catch (err) {
    console.warn('미니맵 렌더 실패:', err);
    el.innerHTML = `<div class="map-fallback"><span class="pin">📍</span><span>지도를 불러오지 못했어요.</span></div>`;
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b) => {
    const active = b.dataset.tab === tab;
    b.classList.toggle('is-active', active);
    b.setAttribute('aria-selected', String(active));
  });
  document.getElementById('view-course').classList.toggle('is-active', tab === 'course');
  document.getElementById('view-map').classList.toggle('is-active', tab === 'map');
  if (tab === 'map') {
    // 지도 탭이 화면에 보이는 상태에서 초기화해야 컨테이너가 0 크기가 되는 문제를 피할 수 있다.
    if (scriptState === 'ready' && !naverMap) {
      try { initOverviewMap(); } catch (err) { console.error('네이버 지도 초기화 실패:', err); showMapFallback(); }
    } else if (scriptState === 'failed') {
      showMapFallback();
    } else if (naverMap) {
      refitMapBounds();
    }
    ensureNaverScriptLoading();
  }
}

function pinSummaryContent(place, index) {
  return `
    <div style="padding:10px 12px;min-width:170px;max-width:210px;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;">
      <div style="font-size:11px;font-weight:700;color:#2D6A4F;margin-bottom:3px;">${place.emoji} ${place.category}</div>
      <div style="font-size:14px;font-weight:800;color:#1C2733;margin-bottom:6px;line-height:1.3;">${index + 1}. ${place.name}</div>
      <div style="font-size:11.5px;color:#6B7A89;line-height:1.5;margin-bottom:8px;">🕒 ${place.hoursSummary}</div>
      <button type="button" onclick="window.openDetailModal('${place.id}')" style="width:100%;border:none;background:#2D6A4F;color:#fff;font-size:12px;font-weight:700;padding:7px 0;border-radius:8px;cursor:pointer;">상세보기</button>
    </div>
  `;
}

function showPinSummary(index) {
  const place = ROUTE[index];
  if (!pinInfoWindow) {
    pinInfoWindow = new naver.maps.InfoWindow({ content: '', maxWidth: 220, backgroundColor: '#fff', borderColor: '#E5E9EE', borderWidth: 1, anchorSize: new naver.maps.Size(12, 10), pixelOffset: new naver.maps.Point(0, -4) });
  }
  pinInfoWindow.setContent(pinSummaryContent(place, index));
  pinInfoWindow.open(naverMap, mapMarkers[index]);
}

function pathLatLngs(coords) { return coords.map((c) => new naver.maps.LatLng(c[0], c[1])); }

function fullPathCoords() {
  let coords = [[ROUTE[0].lat, ROUTE[0].lng]];
  SEGMENTS.forEach((seg) => { coords = coords.concat(seg.geometry.slice(1)); });
  return coords;
}

function initOverviewMap() {
  const el = document.getElementById('naver-map');
  const startPlace = ROUTE[currentIndex]; // 지도가 뜨기 전에 이미 이전/다음으로 이동했을 수도 있으므로 현재 위치 기준으로 초기화한다.
  naverMap = new naver.maps.Map(el, {
    center: new naver.maps.LatLng(startPlace.lat, startPlace.lng),
    zoom: 12,
    logoControlOptions: { position: naver.maps.Position.TOP_LEFT }
  });

  mapMarkers = ROUTE.map((place, i) => new naver.maps.Marker({
    position: new naver.maps.LatLng(place.lat, place.lng),
    map: naverMap,
    icon: pinIcon(place, i + 1, i === currentIndex),
    zIndex: 10
  }));
  mapMarkers.forEach((marker, i) => {
    naver.maps.Event.addListener(marker, 'click', () => showPinSummary(i));
  });
  naver.maps.Event.addListener(naverMap, 'click', () => { if (pinInfoWindow) pinInfoWindow.close(); });

  const full = fullPathCoords();
  remainingPolyline = new naver.maps.Polyline({ map: naverMap, path: pathLatLngs(full), strokeColor: '#9AA5B1', strokeOpacity: 0.9, strokeWeight: 4, strokeStyle: 'shortdash' });
  traveledPolyline = new naver.maps.Polyline({ map: naverMap, path: [], strokeColor: '#2D6A4F', strokeOpacity: 0.95, strokeWeight: 5 });

  carMarker = new naver.maps.Marker({ position: new naver.maps.LatLng(startPlace.lat, startPlace.lng), map: naverMap, icon: carIcon('car'), zIndex: 25 });
  carInfoWindow = new naver.maps.InfoWindow({ content: '', disableAnchor: true, backgroundColor: 'transparent', borderWidth: 0 });

  const bounds = new naver.maps.LatLngBounds(new naver.maps.LatLng(ROUTE[0].lat, ROUTE[0].lng), new naver.maps.LatLng(ROUTE[0].lat, ROUTE[0].lng));
  ROUTE.forEach((p) => bounds.extend(new naver.maps.LatLng(p.lat, p.lng)));
  naverMap.fitBounds(bounds, { top: 50, right: 40, bottom: 50, left: 40 });

  updateMapUI();
}

function refitMapBounds() {
  if (!naverMap) return;
  const bounds = new naver.maps.LatLngBounds(new naver.maps.LatLng(ROUTE[0].lat, ROUTE[0].lng), new naver.maps.LatLng(ROUTE[0].lat, ROUTE[0].lng));
  ROUTE.forEach((p) => bounds.extend(new naver.maps.LatLng(p.lat, p.lng)));
  naverMap.fitBounds(bounds, { top: 50, right: 40, bottom: 50, left: 40 });
}

function showToast(text) {
  const el = document.getElementById('map-toast');
  el.textContent = text;
  el.classList.add('is-visible');
}
function hideToast() {
  document.getElementById('map-toast').classList.remove('is-visible');
}

function flashToast(text, ms) {
  showToast(text);
  setTimeout(hideToast, ms || 2200);
}

function locateMe() {
  if (!naverMap) {
    flashToast('지도가 준비되지 않아 위치를 표시할 수 없어요');
    return;
  }
  if (!navigator.geolocation) {
    flashToast('이 브라우저는 위치 확인을 지원하지 않아요');
    return;
  }
  const btn = document.getElementById('btn-mylocation');
  btn.disabled = true;
  showToast('내 위치 확인 중...');

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      btn.disabled = false;
      hideToast();
      const { latitude, longitude } = pos.coords;
      const latLng = new naver.maps.LatLng(latitude, longitude);
      if (myLocationMarker) {
        myLocationMarker.setPosition(latLng);
      } else {
        myLocationMarker = new naver.maps.Marker({ position: latLng, map: naverMap, icon: myLocationIcon(), zIndex: 30 });
      }
      naverMap.morph(latLng, Math.max(naverMap.getZoom(), 13));
      viewingMyLocation = true;
    },
    (err) => {
      btn.disabled = false;
      const messages = {
        1: '위치 권한이 거부됐어요. 브라우저 설정에서 허용해주세요',
        2: '현재 위치를 확인할 수 없어요',
        3: '위치 확인이 시간 초과됐어요'
      };
      flashToast(messages[err.code] || '위치를 확인하지 못했어요');
    },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
  );
}

function updateMapUI() {
  const place = ROUTE[currentIndex];
  document.getElementById('panel-badge').textContent = currentIndex + 1;
  document.getElementById('panel-name').textContent = place.name;
  document.getElementById('panel-meta').textContent = `${place.category} · ${currentIndex + 1} / ${ROUTE.length}`;
  document.getElementById('btn-prev').disabled = currentIndex === 0;
  document.getElementById('btn-next').disabled = currentIndex === ROUTE.length - 1;

  if (!naverMap) return; // 지도가 아직 로드되지 않았으면(또는 폴백 상태) 여기서 끝낸다.

  mapMarkers.forEach((m, i) => m.setIcon(pinIcon(ROUTE[i], i + 1, i === currentIndex)));

  const full = fullPathCoords();
  let traveledCount = 0;
  for (let i = 0; i < currentIndex; i++) traveledCount += SEGMENTS[i].geometry.length - 1;
  traveledCount += 1;
  traveledPolyline.setPath(pathLatLngs(full.slice(0, traveledCount)));
  remainingPolyline.setPath(pathLatLngs(full.slice(traveledCount - 1)));

  if (carMarker) carMarker.setPosition(new naver.maps.LatLng(place.lat, place.lng));
}

function animateCarAlong(segment, reverse, onDone) {
  const geometry = reverse ? segment.geometry.slice().reverse() : segment.geometry;
  const mode = segment.distanceM > 1000 ? 'car' : 'walk';
  carMarker.setIcon(carIcon(mode));
  const carMin = formatMin(segment.durationS / 60);
  const walkMin = formatMin(segment.walkMin);
  showToast(`🚗 이동 중... 자차 약 ${carMin} / 🚶 도보 약 ${walkMin}`);

  // 탭이 백그라운드로 가면 requestAnimationFrame이 브라우저에 의해 무기한 멈출 수 있어
  // (버튼이 영영 비활성 상태로 남는 원인이었다), setTimeout 안전장치로 항상 종료를 보장한다.
  let done = false;
  function finish() {
    if (done) return;
    done = true;
    carAnimRaf = null;
    clearTimeout(carAnimFallback);
    carAnimFallback = null;
    hideToast();
    carMarker.setPosition(new naver.maps.LatLng(segment.to.lat, segment.to.lng));
    onDone();
  }
  carAnimFallback = setTimeout(finish, CAR_ANIM_MS + 800);

  const start = performance.now();
  function tick(now) {
    if (done) return;
    const t = Math.min(1, (now - start) / CAR_ANIM_MS);
    const segFloat = t * (geometry.length - 1);
    const idx = Math.max(0, Math.min(geometry.length - 2, Math.floor(segFloat)));
    const localT = segFloat - idx;
    const [lat1, lng1] = geometry[idx];
    const [lat2, lng2] = geometry[Math.min(geometry.length - 1, idx + 1)];
    const lat = lat1 + (lat2 - lat1) * localT;
    const lng = lng1 + (lng2 - lng1) * localT;
    carMarker.setPosition(new naver.maps.LatLng(lat, lng));

    if (t < 1) {
      carAnimRaf = requestAnimationFrame(tick);
    } else {
      finish();
    }
  }
  carAnimRaf = requestAnimationFrame(tick);
}

function goToStop(nextIndex) {
  if (carAnimRaf) cancelAnimationFrame(carAnimRaf);
  if (carAnimFallback) clearTimeout(carAnimFallback);
  if (pinInfoWindow) pinInfoWindow.close();

  // 내 위치를 보고 있던 상태(여행지와 멀리 떨어져 있을 수 있음)에서 이전/다음을 누르면,
  // 그 위치 기준으로 한 칸 이동하는 대신 코스 첫 번째 장소로 돌아가 지도를 다시 보여준다.
  if (viewingMyLocation) {
    viewingMyLocation = false;
    currentIndex = 0;
    updateMapUI();
    if (naverMap) {
      const place = ROUTE[0];
      naverMap.morph(new naver.maps.LatLng(place.lat, place.lng), 13);
    }
    return;
  }

  if (nextIndex < 0 || nextIndex >= ROUTE.length || nextIndex === currentIndex) return;
  document.getElementById('btn-prev').disabled = true;
  document.getElementById('btn-next').disabled = true;

  const reverse = nextIndex < currentIndex;
  const segment = reverse ? SEGMENTS[nextIndex] : SEGMENTS[currentIndex];

  if (!naverMap) {
    currentIndex = nextIndex;
    updateMapUI();
    return;
  }

  animateCarAlong(segment, reverse, () => {
    currentIndex = nextIndex;
    updateMapUI();
    const place = ROUTE[currentIndex];
    if (carInfoWindow) {
      carInfoWindow.setContent(`<div style="padding:6px 10px;background:#1C2733;color:#fff;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap;">📍 도착: ${place.name}</div>`);
      carInfoWindow.open(naverMap, carMarker);
      setTimeout(() => carInfoWindow.close(), 2500);
    }
  });
}

/* ===================== 네이버 지도 로딩 =====================
   상세보기 모달(미니맵)과 지도 탭(오버뷰맵)이 서로 다른 시점에 지도 SDK를 필요로 할 수
   있어서, "SDK 스크립트 로딩"과 "각 화면에서의 지도 초기화"를 분리한다. 둘 중 어느 쪽이든
   먼저 트리거하며(ensureNaverScriptLoading은 중복 호출에 안전), 로딩이 끝나면
   onNaverMapsReady/onNaverMapsFailed가 그 시점에 열려 있는 화면(모달/지도 탭)을 갱신한다. */
let scriptState = 'idle'; // 'idle' | 'loading' | 'ready' | 'failed'

function showMapFallback() {
  document.getElementById('map-fallback-full').hidden = false;
  const el = document.getElementById('fallback-order');
  el.innerHTML = ROUTE.map((p, i) => `<div class="fallback-order__item"><span class="fallback-order__badge">${i + 1}</span><span>${p.name}</span></div>`).join('');
  updateMapUI();
}

function onNaverMapsReady() {
  if (document.getElementById('view-map').classList.contains('is-active') && !naverMap) {
    try {
      initOverviewMap();
    } catch (err) {
      console.error('네이버 지도 초기화 실패:', err);
      showMapFallback();
    }
  }
  if (currentModalPlace) renderMiniMap(currentModalPlace);
}

function onNaverMapsFailed() {
  if (document.getElementById('view-map').classList.contains('is-active')) showMapFallback();
  // 모달의 미니맵은 renderMiniMap이 naverReady 값을 보고 스스로 폴백을 표시하므로 별도 처리가 필요 없다.
}

function ensureNaverScriptLoading() {
  if (scriptState !== 'idle') return;

  if (!CONFIG.naverMapClientId || CONFIG.naverMapClientId === 'YOUR_NAVER_CLIENT_ID') {
    console.warn('naverMapClientId가 설정되지 않아 지도를 표시하지 않습니다. CONFIG.naverMapClientId를 설정해주세요.');
    scriptState = 'failed';
    onNaverMapsFailed();
    return;
  }

  scriptState = 'loading';
  const timeout = setTimeout(() => {
    if (scriptState !== 'loading') return;
    scriptState = 'failed';
    onNaverMapsFailed();
  }, 5000);

  window.__onNaverMapsReady = () => {
    if (scriptState !== 'loading') return; // 이미 타임아웃으로 실패 처리된 경우
    clearTimeout(timeout);
    scriptState = 'ready';
    naverReady = true;
    // 네이버 지도 SDK는 이 콜백을 window.naver 할당이 완전히 끝나기 전에 호출할 때가 있어서
    // (동기 실행 중 호출 시 "naver is not defined" ReferenceError 발생), 한 틱 미뤄서 실행한다.
    setTimeout(onNaverMapsReady, 0);
  };

  const script = document.createElement('script');
  script.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(CONFIG.naverMapClientId)}&callback=__onNaverMapsReady`;
  script.onerror = () => {
    if (scriptState !== 'loading') return;
    clearTimeout(timeout);
    scriptState = 'failed';
    onNaverMapsFailed();
  };
  document.head.appendChild(script);
}

/* ===================== 초기화 ===================== */
document.addEventListener('DOMContentLoaded', () => {
  renderSummaryBanner(false);
  renderCourseList(false);

  document.querySelectorAll('.tab-btn').forEach((btn) => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

  document.getElementById('modal-close-x').addEventListener('click', closeDetailModal);
  document.getElementById('modal-close-btn').addEventListener('click', closeDetailModal);
  document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') closeDetailModal(); });
  window.addEventListener('popstate', () => { document.getElementById('modal-overlay').classList.remove('is-open'); currentModalPlace = null; });

  document.getElementById('btn-prev').addEventListener('click', () => goToStop(currentIndex - 1));
  document.getElementById('btn-next').addEventListener('click', () => goToStop(currentIndex + 1));
  document.getElementById('btn-mylocation').addEventListener('click', locateMe);

  updateMapUI();

  resolveAllSegments().then(() => {
    renderSummaryBanner(true);
    renderCourseList(true);
    if (naverMap) {
      const full = fullPathCoords();
      remainingPolyline.setPath(pathLatLngs(full));
    }
  });
});
</script>
</body>
